# Free preview — MUST be a Web Service (Node), NOT a Static Site.
# Plain black "Not Found" usually means Static Site was chosen by mistake.
#
# One-click (after GitHub push):
#   https://dashboard.render.com/select-repo?type=blueprint
#   → pick Ooli-1927/diu-english-smartroutine → Apply
#
# Or: New → Web Service → this repo → settings below
# Delete any existing Static Site with the same name first.

services:
  - type: web
    name: diu-english-smartroutine
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: bash ./scripts/render-build.sh
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      # Same-origin SPA+API works without CORS. Set after first deploy to your URL:
      # https://diu-english-smartroutine.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_DIST
        value: backend/public
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
